    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header { border-bottom: 1px solid var(--border); padding: 20px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    header h1 { font-size: 1.4rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--text2); font-size: 0.8rem; }

    /* Category Tabs */
    .cat-tabs {
      display: flex; gap: 4px; padding: 16px 0; overflow-x: auto;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .cat-tab {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text2); cursor: pointer;
      font-size: 0.8rem; white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
    }
    .cat-tab:hover { border-color: var(--accent); color: var(--text); }
    .cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cat-icon { margin-right: 6px; }

    /* Stats Bar */
    .stats-bar {
      display: flex; gap: 24px; padding: 12px 0; color: var(--text2); font-size: 0.8rem;
      border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap;
    }
    .stat-item strong { color: var(--text); }

    /* Model Grid */
    .models-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px; margin-bottom: 32px;
    }
    .model-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; transition: transform 0.2s, box-shadow 0.2s;
    }
    .model-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-name { font-size: 1rem; font-weight: 700; }
    .card-org { font-size: 0.75rem; color: var(--text2); margin-top: 1px; }
    .card-year { font-size: 0.7rem; background: var(--surface2); padding: 2px 8px; border-radius: 10px; color: var(--text2); }
    .card-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; background: var(--surface2); color: var(--text2); }
    .tag-mit { color: var(--green); border: 1px solid var(--green); background: transparent; }
    .tag-apache { color: var(--blue); border: 1px solid var(--blue); background: transparent; }
    .tag-other { color: #f59e0b; border: 1px solid #f59e0b; background: transparent; }

    /* Benchmark Bars */
    .benchmarks { display: flex; flex-direction: column; gap: 5px; }
    .bench-row { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; }
    .bench-label { width: 100px; flex-shrink: 0; color: var(--text2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bench-bar-bg { flex: 1; height: 16px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .bench-bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.6s ease; }
    .bench-val { width: 52px; flex-shrink: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

    /* Table */
    .table-section { margin: 32px 0; }
    .table-section h2 { font-size: 1.2rem; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th {
      background: var(--surface2); padding: 10px 12px; text-align: left; font-weight: 600;
      white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0;
    }
    th:hover { color: var(--accent); }
    th.sorted { color: var(--accent); }
    td { padding: 8px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
    tr:hover td { background: var(--surface); }
    .rank-cell { font-weight: 700; color: var(--accent); }
    .best-val { color: var(--gold); font-weight: 700; }

    /* Footer */
    footer { border-top: 1px solid var(--border); padding: 20px 0; margin-top: 40px; color: var(--text2); font-size: 0.75rem; text-align: center; }
    footer a { color: var(--accent); text-decoration: none; }

    /* View toggle */
    .view-toggle { display: flex; gap: 4px; background: var(--surface); border-radius: 8px; padding: 3px; border: 1px solid var(--border); width: fit-content; margin-bottom: 16px; }
    .view-btn { padding: 6px 16px; border: none; border-radius: 6px; background: transparent; color: var(--text2); cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .view-btn.active { background: var(--accent); color: #fff; }

    /* Search */

    .search-box input {

      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: 0.85rem; outline: none; transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text2); }

    @media (max-width: 640px) {
      .models-grid { grid-template-columns: 1fr; }
      .bench-label { width: 70px; font-size: 0.65rem; }
      header h1 { font-size: 1.1rem; }
    }
  </style>
</head>

// ============================================================
// RENDERING ENGINE
// ============================================================
let currentCat = "llm";
let currentView = "grid";
let currentSort = { col: null, asc: false };
let searchQuery = "";

function licenseClass(lic) {
  const l = lic.toLowerCase();
  if (l.includes("mit") || l.includes("bsd")) return "tag-mit";
  if (l.includes("apache")) return "tag-apache";
  return "tag-other";
}

// Render category tabs
function renderTabs() {
  const el = document.getElementById("cat-tabs");
  el.innerHTML = Object.entries(categories).map(([key, cat]) =>
    `<button class="cat-tab${key === currentCat ? ' active' : ''}" data-cat="${key}"><span class="cat-icon">${cat.icon}</span>${cat.name}</button>`
  ).join("");
  el.querySelectorAll(".cat-tab").forEach(btn => {
    btn.addEventListener("click", () => { currentCat = btn.dataset.cat; render(); });
  });
}

// Render stats bar
function renderStats() {
  const cat = categories[currentCat];
  const ms = getFilteredModels();
  const years = ms.map(m => m.year).filter(y => y);
  const el = document.getElementById("stats-bar");
  el.innerHTML = `
    <div class="stat-item">カテゴリ: <strong>${cat.icon} ${cat.name}</strong></div>
    <div class="stat-item">モデル数: <strong>${ms.length}</strong></div>
    <div class="stat-item">年代: <strong>${Math.min(...years)}–${Math.max(...years)}</strong></div>
    <div class="stat-item">全カテゴリ合計: <strong>${Object.values(categories).reduce((s,c) => s + c.models.length, 0)} モデル</strong></div>
  `;
}

function getFilteredModels() {
  const cat = categories[currentCat];
  if (!searchQuery) return cat.models;
  const q = searchQuery.toLowerCase();
  return cat.models.filter(m =>
    m.name.toLowerCase().includes(q) || m.org.toLowerCase().includes(q) ||
    (m.arch && m.arch.toLowerCase().includes(q))
  );
}

function renderCards() {
  const cat = categories[currentCat];
  const ms = getFilteredModels();
  const grid = document.getElementById("models-grid");
  grid.innerHTML = ms.map(m => {
    const bars = cat.metrics.map(met => {
      const val = m[met.key];
      if (val === undefined || val === null) return "";
      const pct = met.lowerBetter
        ? Math.max(0, (1 - val / met.max) * 100)
        : Math.min((val / met.max) * 100, 100);
      const display = val + (met.unit || "");
      return `<div class="bench-row">
        <span class="bench-label">${met.label}</span>
        <div class="bench-bar-bg"><div class="bench-bar" style="width:${pct}%"></div></div>
        <span class="bench-val">${display}</span>
      </div>`;
    }).join("");
    return `<div class="model-card">
      <div class="card-head">
        <div><div class="card-name">${m.name}</div><div class="card-org">${m.org}</div></div>
        <span class="card-year">${m.year}</span>
      </div>
      <div class="card-tags">
        <span class="tag ${licenseClass(m.license)}">${m.license}</span>
        ${m.arch ? `<span class="tag">${m.arch}</span>` : ""}
        <span class="tag">${m.params}</span>
        ${m.note ? `<span class="tag">${m.note}</span>` : ""}
      </div>
      <div class="benchmarks">${bars}</div>
    </div>`;
  }).join("");
}

function renderTable() {
  const cat = categories[currentCat];
  const ms = getFilteredModels();
  const baseCols = [
    { key: "_rank", label: "#" },
    { key: "name", label: "モデル" },
    { key: "org", label: "組織" },
    { key: "year", label: "年" },
    { key: "params", label: "パラメータ" },
    { key: "arch", label: "アーキテクチャ" }
  ];
  const metCols = cat.metrics.map(met => ({ key: met.key, label: met.label }));
  const cols = [...baseCols, ...metCols, { key: "license", label: "ライセンス" }];

  const thead = document.getElementById("table-head");
  thead.innerHTML = `<tr>${cols.map(c =>
    `<th data-col="${c.key}" class="${currentSort.col === c.key ? 'sorted' : ''}">${c.label}</th>`
  ).join("")}</tr>`;

  // Sort
  let sorted = [...ms];
  if (currentSort.col && currentSort.col !== "_rank") {
    sorted.sort((a, b) => {
      let va = a[currentSort.col], vb = b[currentSort.col];
      if (va === undefined) va = "";
      if (vb === undefined) vb = "";
      if (typeof va === "number" && typeof vb === "number") return currentSort.asc ? va - vb : vb - va;
      return currentSort.asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
  }

  // Find best values
  const bests = {};
  cat.metrics.forEach(met => {
    const vals = ms.map(m => m[met.key]).filter(v => typeof v === "number");
    bests[met.key] = met.lowerBetter ? Math.min(...vals) : Math.max(...vals);
  });

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = sorted.map((m, i) => {
    const cells = cols.map(c => {
      if (c.key === "_rank") return `<td class="rank-cell">${i + 1}</td>`;
      if (c.key === "name") return `<td><strong>${m.name}</strong></td>`;
      if (c.key === "license") return `<td><span class="tag ${licenseClass(m.license)}">${m.license}</span></td>`;
      const val = m[c.key];
      if (val === undefined || val === null) return `<td>-</td>`;
      const isBest = bests[c.key] !== undefined && val === bests[c.key];
      return `<td class="${isBest ? 'best-val' : ''}">${val}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");

  // Sort handlers
  thead.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (col === "_rank") return;
      currentSort = { col, asc: currentSort.col === col ? !currentSort.asc : false };
      renderTable();
    });
  });
}

function render() {
  renderTabs();
  renderStats();
  renderCards();
  renderTable();
  document.getElementById("grid-view").style.display = currentView === "grid" ? "" : "none";
  document.getElementById("table-view").style.display = currentView === "table" ? "" : "none";
}

// View toggle
document.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    document.getElementById("grid-view").style.display = currentView === "grid" ? "" : "none";
    document.getElementById("table-view").style.display = currentView === "table" ? "" : "none";
  });
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderCards();
  renderTable();
  renderStats();
});

render();
</script>
